global:
  resolve_timeout: 5m
  # Set SLACK_WEBHOOK_URL env var at runtime; this placeholder keeps config valid for linting
  slack_api_url: 'https://hooks.slack.com/services/PLACEHOLDER/PLACEHOLDER/PLACEHOLDER'

# Notification templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree
route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-default'

  routes:
    # Critical alerts — immediate notification
    - match:
        severity: critical
      receiver: 'slack-critical'
      group_wait: 10s
      repeat_interval: 1h
      continue: false

    # Inventory alerts
    - match:
        team: inventory
      receiver: 'slack-inventory'
      group_wait: 1m
      continue: false

    # Platform/infra alerts
    - match:
        team: platform
      receiver: 'slack-platform'
      continue: false

# Inhibit lower-severity alerts when a service is down
inhibit_rules:
  - source_match:
      alertname: 'ServiceDown'
    target_match:
      severity: 'warning'
    equal: ['job']

receivers:
  - name: 'slack-default'
    slack_configs:
      - channel: '#observability-alerts'
        send_resolved: true
        icon_url: 'https://avatars3.githubusercontent.com/u/3380462'
        title: '{{ template "slack.default.title" . }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Severity:* `{{ .Labels.severity }}`
            *Job:* `{{ .Labels.job }}`
          {{ end }}

  - name: 'slack-critical'
    slack_configs:
      - channel: '#observability-critical'
        send_resolved: true
        icon_emoji: ':fire:'
        color: '#FF0000'
        title: ':fire: CRITICAL: {{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}

  - name: 'slack-inventory'
    slack_configs:
      - channel: '#inventory-alerts'
        send_resolved: true
        icon_emoji: ':package:'
        title: ':package: Inventory Alert: {{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
          {{ end }}

  - name: 'slack-platform'
    slack_configs:
      - channel: '#platform-alerts'
        send_resolved: true
        icon_emoji: ':hammer_and_wrench:'
        title: ':hammer_and_wrench: Platform Alert: {{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
          {{ end }}
